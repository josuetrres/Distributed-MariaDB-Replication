version: '3.8'

services:
  mariadb-replica2:
    image: mariadb:10.11
    container_name: mariadb-replica2-pc3
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass_segura}
      MARIADB_DATABASE: ${DB_NAME:-banco_acid_db}
      MARIADB_USER: ${DB_USER:-banco_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-banco_pass_segura}
      MASTER_HOST: ${PC1_IP:-192.168.1.10}
      REPL_USER: ${REPL_USER:-repl_user}
      REPL_PASSWORD: ${REPL_PASSWORD:-repl_pass_segura}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - ./pc3/mariadb/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./pc3/mariadb/setup-replica.sh:/docker-entrypoint-initdb.d/setup-replica.sh
      - mariadb_replica2_data:/var/lib/mysql

  api3:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: api3-pc3
    restart: always
    environment:
      SERVER_PORT: ${API3_PORT:-8083}
      DB_MASTER_HOST: ${PC1_IP:-192.168.1.10}
      DB_REPLICA_HOST: mariadb-replica2
      DB_NAME: ${DB_NAME:-banco_acid_db}
      DB_USER: ${DB_USER:-banco_user}
      DB_PASSWORD: ${DB_PASSWORD:-banco_pass_segura}
      NODE_NAME: "API3-PC3 (Replica 2)"
    ports:
      - "${API3_PORT:-8083}:8083"
    depends_on:
      - mariadb-replica2

volumes:
  mariadb_replica2_data:
